version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/tmc/nlm/gen
    except:
      - buf.build/googleapis/googleapis
plugins:
  # Local plugins run via `go run` at pinned versions, so code generation needs
  # no Buf Schema Registry token (the remote buf.build/* plugins did). Versions
  # match the committed output: protoc-gen-go v1.31.0, protoc-gen-go-grpc v1.3.0.
  - plugin: go
    path: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.31.0"]
    out: ../gen
    opt: paths=source_relative
  - plugin: go-grpc
    path: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0"]
    out: ../gen
    opt: paths=source_relative
  # protoc-gen-anything is a local dev tool; keep it on $PATH.
  - plugin: anything
    out: ../gen
    opt:
      - templates=templates
      - paths=source_relative
      - goimports=true
    strategy: all
