    //   [ [source_id], title,
    //     [null, status, [added_ts], [origin_source_id, [origin_ts]], type,
    //      null, 1, null, byte_size, null×5, [indexed_ts], null×4, mime_type],
    //     [null, 2], null, download_url, viewer_url, ... ]
    // AddSources (izAoDd) returns the same descriptor inside a list.
    rpc LoadSource(LoadSourceRequest) returns (LoadSourceResponse) {
        option (rpc_id) = "hizoJc";
        option (arg_format) = "[%source%, %mode%, [2, null, [1], [1, null, null, null, null, null, null, null, null, null, [1, 3]]]]";
    }
    rpc MutateSource(MutateSourceRequest) returns (Source) {
        option (rpc_id) = "b7Wfje";
        option (arg_format) = "[null, %source_id%, %updates%, [2, null, [1], [1, null, null, null, null, null, null, null, null, null, [1, 3]]]]";
    }
    rpc RefreshSource(RefreshSourceRequest) returns (Source) {
        option (rpc_id) = "FLmJqe";
        option (arg_format) = "[null, %source%, %context%]";
    }
    
    // Audio operations
    rpc CreateAudioOverview(CreateAudioOverviewRequest) returns (Artifact) {
        option (rpc_id) = "R7cb6c";
        // Format discovered from HAR analysis:
        // [[audio_type], project_id, [null, null, 1, [[[source_ids]]], null, null,
        //   [null, [custom_instructions, length, null, [[[source_ids]]], language, true, 1]]]]
        // Using custom encoder for this complex structure
        //
        // R7cb6c is CreateUniversalArtifact (audio/video/report/flashcards/
        // slides). Every observed response is the shared Artifact row shape;
        // Artifact.type and its type-specific preview identify the result.
    }
    rpc GetAudioOverview(GetAudioOverviewRequest) returns (AudioOverview) {
        option (rpc_id) = "VUsiyb";
        option (arg_format) = "[%project_id%]";
    }
    rpc DeleteAudioOverview(DeleteAudioOverviewRequest) returns (google.protobuf.Empty) {
        option (rpc_id) = "sJDbic";
        option (arg_format) = "[%project_id%]";
    }

    // Video operations (uses same R7cb6c RPC as audio but with mode=3)
    rpc CreateVideoOverview(CreateVideoOverviewRequest) returns (Artifact) {
        option (rpc_id) = "R7cb6c";
        // Format discovered from HAR analysis:
        // [[audio_type], project_id, [null, null, 3, [[[source_ids]]], null, null, null, null,
        //   [null, null, [[[source_ids]], language, custom_instructions, null, 1, video_style]]]]
        // Using custom encoder for this complex structure
    }
    // Decode-complete binding for the polymorphic R7cb6c request envelope.
    rpc CreateUniversalArtifact(CreateUniversalArtifactRequest) returns (Artifact) {
        option (rpc_id) = "R7cb6c";
        option (arg_format) = "[%context%, %project_id%, %options%, null, null, %unknown_6%]";
    }
    
    // Note operations
    rpc CreateNote(CreateNoteRequest) returns (NoteRecord) {
        option (rpc_id) = "CYK0Xb";
        // Two-step note protocol (HAR-verified 2026-04-28): CreateNote makes an
        // empty "New Note" shell; the title/body are set afterward by MutateNote.
        // The shell shape passes literals, not the request's title/content.
        option (arg_format) = "[%project_id%, \"\", %note_type%, null, \"New Note\", null, [2, null, [1], [1, null, null, null, null, null, null, null, null, null, [1, 3]]]]";
    }
    rpc DeleteNotes(DeleteNotesRequest) returns (google.protobuf.Empty) {
        option (rpc_id) = "AH0mwd";
        option (arg_format) = "[%project_id%, null, %note_ids%, %context%]";
    }
    rpc GetNotes(GetNotesRequest) returns (GetNotesRichWireResponse) {
        option (rpc_id) = "cFji9";
        option (arg_format) = "[%project_id%, null, %since%, %context%]";
    }
    rpc MutateNote(MutateNoteRequest) returns (Note) {
        option (rpc_id) = "cYAfTb";
        // Second step of the note protocol (HAR-verified 2026-04-28): sets the
