// MutateLabelsModeRequest is the mode form of agX4Bc. Mode 0 labels
// previously-unlabeled sources; mode 1 relabels all sources.
message MutateLabelsModeRequest {
    RequestContext context = 1;
    string project_id = 2;
    // Fields 3 and 4 are null in observed requests.
    LabelMode mode = 5;
}

message LabelMode {
    optional int32 value = 1;
}

message LabelCreation {
    string name = 1;
    optional string emoji = 2;
}

message CreateLabelResponse {
    // Field 1 (Label label) is null in every observed capture; the RPC
    // returns the full refreshed label list at field 2 instead.
    Label label = 1;
    repeated Label labels = 2;
}

// MutateLabelRequest wire (HAR-verified, more-requests2):
//   [<RequestContext>, project_id, label_id, [<mutation>]]
// The live path (api.Client.mutateLabel) hand-builds these args and does not
// use this message as an encoder, so the layout is decode-only. The mutation
// block has two observed inner shapes: [[name, emoji]] (rename/emoji) and
// [null, [[source_id]]] (attach source); the captured request is the latter.
message MutateLabelRequest {
    RequestContext context = 1;
    string project_id = 2;
    string label_id = 3;
    MutateLabelMutation mutation = 4;
}

// MutateLabelMutation is field 4: [[null, [[source_id]]]] (source-attach form)
// or [[name, emoji]] (metadata form). Field 1 wraps the inner mutation entry.
message MutateLabelMutation {
    MutateLabelEntry entry = 1;
}

message MutateLabelEntry {
    // Metadata form uses field 1 (name) / field 2 (emoji); the source-attach
    // form leaves field 1 null and carries the source ids at field 2, each id
    // wrapped as ["uuid"] (SourceIdList, the same wrapper Label.sources uses).
    LabelNameChange name = 1;
    repeated SourceIdList sources = 2;
    repeated SourceIdList alternate_sources = 3;
}

message LabelNameChange {
    string name = 1;
}

message MutateLabelResponse {
    Label label = 1;
}

