// GetDeepResearchSessions (e3bVqc, polymorphic with DeleteChatHistory).
// Wire shape: [null, null, project_id]
// Response is a list of deep+fast research sessions; clients filter by
// (research_id, mode=5) for deep or (conversation_id, mode=1) for fast.
message GetDeepResearchSessionsRequest {
    string project_id = 1;
}

// PollDeepResearchRequest is the job-handle e3bVqc variant.
message PollDeepResearchRequest {
    RequestContext context = 1;
    string job_handle = 3;
}

message GetDeepResearchSessionsResponse {
    repeated DeepResearchSession sessions = 1;
}

// PollDeepResearchResponse is the job-handle e3bVqc result envelope.
message PollDeepResearchResponse {
    repeated DeepResearchSession sessions = 1;
}

// HAR-verified wire shape (2026-07-21, e3bVqc/GetDeepResearchSessions), per
// session entry:
//
//   [
//     conversation_id,                 // [0] UUID string
//     [                                // [1] inner
//       project_id,                    //   [0] UUID string
//       [query, 1],                    //   [1] query + int
//       mode,                          //   [2] 1 = fast, 5 = deep
//       [ <report_tree> (, extra_str) ],//  [3] main_blob; variable length
//       state,                         //   [4] int (6 observed)
//       [research_id, plan_b64, 5, null, ts_str],// [5] DEEP ONLY (absent for fast)
//     ],
//     [secs, nanos],                   // [2] timestamp pair
//     [secs, nanos],                   // [3] timestamp pair
//     "157962509464",                  // [4] numeric timestamp string
//   ]
//
//   report_tree ([1][3][0]) is a 72-element deep-research report: element [0] is
//   a [null, title, ...] header, elements [1..N] are source citations
//   [url, title, ...9 fields]. ~334KB; distinct from the Span/chat document tree.
//
message DeepResearchSession {
    string conversation_id = 1;
    DeepResearchSessionDetails details = 2;
    DeepResearchTimestamp created = 3;
    DeepResearchTimestamp updated = 4;
    string account_id = 5;
}

message DeepResearchSessionDetails {
    string project_id = 1;
    DeepResearchQuery query = 2;
    optional int32 mode = 3;
    DeepResearchMainBlob main_blob = 4;
    optional int32 state = 5;
    DeepResearchMetadata metadata = 6;
}

message DeepResearchQuery {
    string text = 1;
    optional int32 kind = 2;
}

// DeepResearchMainBlob is [report_tree, extra]. The extra string is present
// only on fast-research results.
message DeepResearchMainBlob {
    repeated DeepResearchReportEntry report_tree = 1;
    optional string extra = 2;
}

// DeepResearchReportEntry covers both the report header at entry zero and the
// source-citation rows that follow it. Fast-research results use the same
// prefix, omitting the deep-only detail fields.
message DeepResearchReportEntry {
    optional string url = 1;
    optional string title = 2;
    optional string summary = 3;
    optional int32 kind = 4;
    optional string favicon_url = 6;
    DeepResearchReportDetail detail = 7;
    optional bool selected = 8 [(json_bool) = true];
    optional int32 rank = 9;
}

// DeepResearchReportDetail covers the header's rendered report and the
// citation row's extracted text. Their wire layouts share the same six-slot
// positional group and differ only in which optional fields are populated.
message DeepResearchReportDetail {
    optional string markdown = 1;
    optional int32 kind = 2;
    optional string excerpt = 3;
    optional int32 rank = 5;
    RichDocument document = 6;
}

message DeepResearchMetadata {
    string research_id = 1;
    optional string plan = 2;
    optional int32 kind = 3;
    optional string backend = 5;
}

message DeepResearchTimestamp {
    optional int64 seconds = 1;
    optional int32 nanos = 2;
}

// DeleteDeepResearch (LBwxtb, 4-position polymorphic variant).
// Wire shape: [null, [1], conversation_id, project_id]
message DeleteDeepResearchRequest {
    string project_id = 1;
    string conversation_id = 2;
}

message DeleteDeepResearchResponse {
    // empty array on success
}

// BulkImportFromResearch (LBwxtb, 5-position polymorphic variant).
// Wire shape:
//   [null, [1], conversation_id, project_id, [source_1, ..., source_N]]
//
// HAR captures show two distinct per-source tuple shapes selected by
// position [10]:
//
//   URL import (api.bulkImportArgs at client.go:5102, source_type=2):
//     [null, null, [url, title], null × 7, 2]
//
//   Note/text import (HAR-observed in
//   NotebookLM web UI capture, 2026-04-23, importing a 3.4kB markdown
//   research report,
//   source_type=3):
//     [null, [title, content_markdown], null, 3, null × 5, 3]
//
// The Go side currently encodes only the URL variant; the note variant
// is a follow-up. BulkImportSourceInput carries enough fields to model
// both — content stays empty for URL imports, url stays empty for
// note imports.
message BulkImportFromResearchRequest {
    string project_id = 1;
    string conversation_id = 2;
    repeated BulkImportSourceInput sources = 3;
}

message BulkImportSourceInput {
    string url = 1;
    string title = 2;
    // content holds inline markdown when this source is a note/text
    // import (type=3). Leave empty for URL imports (type=2).
    string content = 3;
    // source_type matches the trailing enum int in the wire tuple:
    //   2 = URL  (url + title populated)
    //   3 = NOTE (title + content populated)
    int32 source_type = 4;
}

// BulkImportFromResearchWireRequest is the positional note/text import form
// observed from the web UI. The live URL-import API keeps its logical request
// type and custom encoder above.
message BulkImportFromResearchWireRequest {
    RequestContext context = 1;
    Int32List marker = 2;
    string conversation_id = 3;
    string project_id = 4;
    repeated BulkImportTextSource sources = 5;
}

message BulkImportTextSource {
    // Field 1 is null.
    BulkImportTextContent content = 2;
    BulkImportTextSourceLink unknown_3 = 3;
    int32 content_type = 4;
    // Fields 5 through 10 are null.
    int32 source_type = 11;
}

// BulkImportTextSourceLink is an observed [URL, title] source reference.
message BulkImportTextSourceLink {
    string url = 1;
    string title = 2;
}

message BulkImportTextContent {
    string title = 1;
    string markdown = 2;
}

// BulkImportFromResearchResponse carries enriched Source descriptors in
// request order. The live API projects the generated response to its narrow
// BulkImportResult public type.
message BulkImportFromResearchResponse {
    repeated Source results = 1;
}

// BulkImportResult is the former partial projection of an imported Source.
// Deprecated: BulkImportFromResearchResponse now returns Source values.
message BulkImportResult {
    option deprecated = true;
    string source_id = 1;
    string title = 2;
    string url = 3;
}

// GetAudioFormats (sqTeoe). HAR-verified against 11+ captures
// (notebooklm.google.com.jsonl, 2026-04-19..2026-04-23). Returns the
// full create-artifact menu — audio styles, video styles, slide
// styles, AND the prebuilt briefing-doc/study-guide templates. The
// request is a fixed-sentinel payload (no varying fields), so it has
// no arg_format. The same RPC powers every "create X" picker the UI
// shows.
message GetAudioFormatsRequest {
    // Wire shape: [[2, null, null, [1, null × 9, [1]], [[1,4,8,10,2,3,6,9]]], null, 1]
    RequestContext context = 1;
    // Field 2 is null in observed requests.
    optional int32 mode = 3; // observed 1
}

// Response shape (HAR-verified): four positional entries, each itself
// wrapped in an extra array layer:
//   [
//     [<audio_kinds>],     // [[id, name, description], ...]
//     [<video_kinds>],
//     [<slide_kinds>],
//     [<doc_templates>],   // [[title, subtitle, system_prompt], ...]
//   ]
// audio/video/slide kinds share the AudioFormat shape; doc templates use
// the distinct DocTemplate shape. The extra wrapping layer is modeled with
// one-field list-wrapper messages so a present-but-empty kind round-trips
// as [] rather than null.
message GetAudioFormatsResponse {
    AudioFormatList audio_kinds = 1;
    AudioFormatList video_kinds = 2;
    AudioFormatList slide_kinds = 3;
    DocTemplateList doc_templates = 4;
}

message AudioFormatList {
    repeated AudioFormat items = 1;
}

message DocTemplateList {
    repeated DocTemplate items = 1;
}

// AudioFormat captured kinds (HAR 2026-04-19+):
//   1 = "Deep Dive"  — two-host conversation
//   2 = "Brief"      — bite-sized overview
//   3 = "Critique"   — expert review w/ feedback
//   4 = "Debate"     — two-host opposing perspectives
message AudioFormat {
    int32 id = 1;
    string name = 2;
    string description = 3;
}

// DocTemplate is a prebuilt briefing-doc/study-guide template:
// [title, subtitle, system_prompt].
message DocTemplate {
    string title = 1;
    string subtitle = 2;
    string system_prompt = 3;
}

// GenerateDocumentGuides (tr032e): per-source guide.
// Wire shape: [[[[source_id]]]]
// Response: [[[null, [summary], [[topic, ...]], []]]]
// Note: the existing GenerateDocumentGuidesRequest at line ~709 keys
// off project_id, but the live wire call keys off source_id. The
// response message GenerateDocumentGuidesResponse is defined in
// notebooklm.proto:163 and reused here.

// LogEvent (ozz5Z) is a misnomer per rpc.go's constant; the wire RPC is
// actually a promo/upsell-card placement lookup. HAR-verified across
// 12+ captures (notebooklm.google.com.jsonl, 2026-04-19..2026-04-23).
//
// Wire request:
//   [[[[null, "1", 627], [null × 9, [null, null, 2]], 1]]]
//
// 627 is the campaign/slot id (constant across all captures); "1" is
// locale/surface; the [null, null, 2] tail at position [9] of the
// inner array is opaque. The whole request is a fixed sentinel — the
// only varying byte is the f.sid, which lives outside the f.req body.
// No Go caller invokes this RPC today; the message exists so future
// regenerated stubs match the wire reality rather than the rpc.go
// label.
message LogEventRequest {
    repeated LogEventEntry events = 1;
}

message LogEventEntry {
    LogEventSlot slot = 1;
    LogEventContext context = 2;
    int32 enabled = 3;
}

message LogEventSlot {
    // Field 1 is null in observed requests.
    string surface = 2;
    int32 campaign_id = 3;
}

message LogEventContext {
    // Fields 1 through 9 are null in observed requests.
    LogEventMarker marker = 10;
}

message LogEventMarker {
    // Fields 1 and 2 are null in observed requests.
    int32 code = 3;
}

// Wire response is a repeated array of log-event acknowledgements, one
// per logged event in the request (observed: always exactly one).
// Captured layout (HAR-verified across 5 captures, all structurally
// identical modulo tracking IDs):
//   [[[
//     [null, "1", 627],                         // slot
//     [[2230, [null × 9,
//       [[null, "NotebookLM icon", "edit"],
//        [[[null, null, "<settings_url>"], false], null, null,
//         "Manage subscription", null, "Manage subscription",
//         null, null, [<click_event>]]],
//      null × 10,
//      [<impression_event>]],
//      null, 2351, 2351, 2230,
//      "NOTEBOOKLM_TIER_ULTRA_LIGHT_CONSUMER_USER", null, null, false, []]],
//     0]]]
//
// The outer-outer [ ] is the repeated wrapper (LogEventResponse itself);
// each element is a PromoLogEntry. user_tier (PromoCard field 7) is the
// only durable, human-meaningful field; everything else is
// rendering/impression-tracking chrome, but is modeled fully so the
// response round-trips losslessly.
message LogEventResponse {
    repeated PromoLogEntry entries = 1;
}

// PromoLogEntry is one acknowledged log event: [slot, cards, status].
message PromoLogEntry {
    // [0] slot/campaign descriptor, e.g. [null, "1", 627].
    PromoSlot slot = 1;
    // [1] repeated upsell cards (one observed per response).
    repeated PromoCard cards = 2;
    // [2] observed 0 in all captures; needs presence to avoid
    // collapsing to null on empty re-encode.
    optional int32 status = 3;
}

// PromoSlot identifies a promo placement: [_, surface_locale, campaign_id].
// Reused both as the top-level slot and nested inside
// PromoCardEventContext.
message PromoSlot {
    // field 1 ([0]) is null in all observed captures; left unmodeled.
    optional string surface = 2;    // [1] e.g. "1"
    optional int32 campaign_id = 3; // [2] e.g. 627
}

// PromoCard is one upsell-card placement.
message PromoCard {
    int32 id = 1;                  // [0] e.g. 2230 (matches slot campaign)
    PromoCardRender render = 2;    // [1] rendering payload
    // field 3 ([2]) null in all captures; left unmodeled.
    // placement_id is inferred from its reuse in the event context.
    optional int32 placement_id = 4;       // [3] e.g. 2351
    optional int32 placement_id_copy = 5;  // [4] confirmed duplicate of placement_id
    optional int32 card_id_copy = 6;       // [5] confirmed duplicate of id
    string user_tier = 7;          // [6] e.g. "NOTEBOOKLM_TIER_ULTRA_LIGHT_CONSUMER_USER"
    // fields 8, 9 ([7], [8]) null in all captures; left unmodeled.
    // Meaning unconfirmed; false in every observed card.
    optional bool display_flag = 10 [(json_bool) = true]; // [9]
    // field 11 ([10]) is a present-but-empty list in all captures;
    // wrapped so the empty repeated marshals to [] not null.
    PromoCardRefList refs = 11;
}

// PromoCardRender is the 21-position rendering blob for a PromoCard.
// Only positions 10 and 21 carry data in observed captures.
message PromoCardRender {
    // fields 1-9 ([0]-[8]) null in all captures; left unmodeled.
    PromoCardContent content = 10; // [9] icon + action
    // fields 11-20 ([10]-[19]) null in all captures; left unmodeled.
    PromoCardEvent impression_event = 21; // [20] impression tracking
}

// PromoCardContent pairs the card's icon with its click action.
message PromoCardContent {
    PromoCardIcon icon = 1;     // [0]
    PromoCardAction action = 2; // [1]
}

// PromoCardIcon: [null, icon_name, glyph_id].
message PromoCardIcon {
    // field 1 ([0]) null in all captures; left unmodeled.
    optional string name = 2;  // [1] e.g. "NotebookLM icon"
    optional string glyph = 3; // [2] e.g. "edit"
}

// PromoCardAction is the "Manage subscription" call-to-action.
message PromoCardAction {
    PromoCardLinkWrapper link = 1; // [0]
    // fields 2, 3 ([1], [2]) null in all captures; left unmodeled.
    optional string label = 4;      // [3] e.g. "Manage subscription"
    // field 5 ([4]) null in all captures; left unmodeled.
    optional string aria_label = 6; // [5] dup of label
    // fields 7, 8 ([6], [7]) null in all captures; left unmodeled.
    PromoCardEvent click_event = 9; // [8] click tracking
}

// PromoCardLinkWrapper: [[null, null, url], enabled_flag].
message PromoCardLinkWrapper {
    PromoCardLink link = 1;
    optional bool disabled = 2 [(json_bool) = true]; // observed false
}

// PromoCardLink: [null, null, url].
message PromoCardLink {
    // fields 1, 2 ([0], [1]) null in all captures; left unmodeled.
    optional string url = 3; // [2]
}

// PromoCardEvent wraps a logged UI event: [context, kinds, token, sig].
message PromoCardEvent {
    PromoCardEventContext context = 1; // [0]
    repeated int32 kinds = 2;          // [1] e.g. [2] (click) or [14] (impression)
    optional string token = 3;         // [2] opaque base64 tracking token
    optional string signature = 4;     // [3] opaque base64 signature
}

// PromoCardEventContext carries the placement coordinates repeated in
// both the click and impression events.
message PromoCardEventContext {
    optional int32 card_id = 1;      // [0] confirmed match to PromoCard.id
    optional int32 placement_id = 2; // [1] inferred placement coordinate
    // field 3 ([2]) null in all captures; left unmodeled.
    // Meaning unconfirmed; observed as 43 in both event kinds.
    optional int32 context_code = 4; // [3]
    // Confirmed discriminator: 1 on click, absent on impression.
    optional int32 click_marker = 5; // [4]
    // field 6 ([5]) null in all captures; left unmodeled.
    PromoSlot slot = 7;         // [6]
    // field 8 ([7]) null in all captures; left unmodeled.
    // [8] present on click ([[ref]], wrapped one extra layer like
    // SpanList/SourceIssueList), absent (null) on impression.
    PromoCardRefList refs = 9;
    // field 10 ([9]) null in all captures; left unmodeled.
    optional int32 campaign_id = 11;       // [10] confirmed match to PromoSlot.campaign_id
    optional int32 placement_id_copy = 12; // [11] confirmed duplicate of placement_id
    // field 13 ([12]) null in all captures; left unmodeled.
    optional string tracking_id = 14; // [13] large signed decimal string
}

// PromoCardRef: [id, campaign_id, tags].
message PromoCardRef {
    optional int32 id = 1;          // [0] e.g. 2230
    optional int32 campaign_id = 2; // [1] e.g. 627
    repeated int32 tags = 3;        // [2] e.g. [9]
}

// PromoCardRefList wraps PromoCard.refs: present-but-empty in all
// captures, so it needs the wrapper idiom (see SpanList) to round-trip
// [] instead of collapsing to null.
message PromoCardRefList {
    repeated PromoCardRef refs = 1;
}

