}

// ChatMessage is one turn in a GetConversationHistory response. Field numbers
// are positional and match the observed wire layout (HAR-verified against a
// sanitized khqZz capture, 2026-07-20):
//   [message_id, [secs,nanos], role, text, [content_segment...]]
// User turns (role = 1) populate text (field 4); assistant turns (role = 2)
// populate rich_content (field 5) instead. The live client reads this shape
// directly in api.parseConversationHistory; this message mirrors it so
// GetConversationHistoryResponse round-trips through the proto view.
message ChatMessage {
    string message_id = 1;                        // server-assigned message UUID
    google.protobuf.Timestamp timestamp = 2;      // [seconds, nanos]
    int32 role = 3;                               // 1 = user, 2 = assistant
    string text = 4;                              // plain text (user turns)
    RichContent rich_content = 5;                 // structured content (assistant turns)
}

// RichContent is an assistant turn's structured payload:
// [segment, [grounding...], [], [annotation...]]. The segment carries the text
// and rich-text document; the grounding and annotation lists tie the reply
// back to its sources.
message RichContent {
    ContentSegment segment = 1;                   // [0] text + rich document
    repeated Grounding grounding = 2;             // [1] reply-to-source grounding
    // Field 3 ([2]) is an empty array in observed captures; left unmodeled.
    repeated ContentAnnotation annotations = 4;   // [3] source annotation index
}

// ContentAnnotation ties an offset range of the reply to the source indices
// that support it: [[null, start, end], [source_index...]].
message ContentAnnotation {
    OffsetRange range = 1;                        // [0] [null, start, end]
    repeated int64 source_indices = 2;            // [1] indices into grounding
}

// ContentSegment is one span of an assistant turn's rich_content. Each segment
// carries its text and a citation reference; complex segments additionally
// carry a rich-text document payload not modeled here.
message ContentSegment {
    // Empty assistant segments carry an explicit empty string.
    optional string text = 1;
    // Field 2 ([1]) is an empty array in observed captures; left unmodeled.
    CitationRef citation = 3;                     // [source_id, source_id, ref]
    // Field 4 ([3]) is an empty array in observed captures; left unmodeled.
    RichDocument rich_document = 5;               // rendered rich-text tree
}

// CitationRef links a ContentSegment back to its source. The two id fields hold
// the same source UUID in every observed capture; ref is an integer whose
// meaning (chunk offset or citation index) is not yet confirmed.
message CitationRef {
    string source_id = 1;
    string source_id_2 = 2;
    int64 ref = 3;
}

// RichDocument is the rendered rich-text form of an assistant turn: a tree of
// character-offset spans plus per-source grounding records. It is the
// [body, [], [], grounding, flag] payload at ContentSegment field 5.
message RichDocument {
    SpanLayers body = 1;
    // Fields 2 and 3 are empty arrays in observed captures; left unmodeled.
    repeated GroundingRecord grounding = 4;
    int64 flag = 5;                               // small int (1); meaning TBD
}

// GetNotesRichWireResponse is the keyed response shape returned by cFji9.
// The response-side note record differs from the public Note message: rich_text
// is either a legacy string or a structured RichDocument, and field 4 repeats
// the document's grounding details without their source-id keys.
message GetNotesRichWireResponse {
    repeated GetNotesRichEntry entries = 1;
    google.protobuf.Timestamp fetch_time = 2;
}

// GetNotesRichEntry is one keyed GetNotes result: [note_id, note].
message GetNotesRichEntry {
    string note_id = 1;
    GetNotesRichRecord note = 2;
    // Meaning unconfirmed; observed as 2 on keyed entries in several captures.
    optional int32 entry_type = 3;
}

// GetNotesRichRecord is the response-side note tuple used by cFji9.
message GetNotesRichRecord {
    string note_id = 1;
    optional string content_text = 2;
    NoteMetadata metadata = 3;
    NoteGroundingDetails grounding_details = 4;
    string title = 5;
    NoteRichText rich_text = 6;
    repeated int32 note_type = 7;
}

// NoteRichText is a shape union. Older notes carry a plain string; rich notes
// carry the same positional RichDocument tree used by rendered chat content.
message NoteRichText {
    oneof value {
        string plain_text = 1;
        RichDocument document = 2;
    }
}

// NoteGroundingDetails wraps the unkeyed grounding-detail list at note field 4.
// For rich notes, each item is byte-for-byte equal to the Grounding part of the
// corresponding source-keyed GroundingRecord in RichDocument.grounding.
message NoteGroundingDetails {
    repeated Grounding grounding = 1;
}

// SpanLayers holds the document body as two parallel layers over the same text:
// the block tree (headings, paragraphs, list items) and a per-source annotation
// index mapping offset ranges back to their source.
message SpanLayers {
    repeated Span blocks = 1;
    repeated SourceAnnotation annotations = 2;
}

// Span is one character-offset range [start, end] of the rendered document and
// its content. Spans nest recursively: a block span's content is a group of
// child spans, a leaf span's content is text. content is a shape union (see
// SpanContent).
message Span {
    // Offsets are explicitly present so a legitimate 0 (the document start)
    // round-trips as 0 rather than an absent null.
    optional int64 start = 1;
    optional int64 end = 2;
    SpanContent content = 3;
    // Inline images carry [image_url, null, image_id] at position 4 instead of
    // text content. The URL is an authenticated NotebookLM media URL; image_id
    // is the stable UUID for the embedded image.
    SpanImage image = 4;
    // table carries a [type_code, columns, rows] table block instead of the
    // usual content/hidden_content shapes; fields 1-4 and 6-11 are null when
    // it is present.
    SpanTable table = 5;
    // Code blocks carry a [code_text, language] pair at position 7 instead of
    // the usual content (fields 3..6 and 8..11 are null). start/end still bound
    // the block within the document.
    SpanCodeBlock code_block = 7;
    // Hidden/thinking blocks carry their content at position 9 instead of 3
    // (fields 4..8 are null). The content is the same recursive span shape.
    SpanContent hidden_content = 9;
    // Separator spans (e.g. the empty [432,433] between blocks) carry an empty
    // marker array at position 12 instead of content; fields 4..11 are null.
    // Modeled as a present-but-empty message so the trailing [] round-trips.
    Separator separator = 12;
}

// SpanTable is a table block within a rich-text document:
// [type_code, columns, rows]. Observed type codes vary; their meaning is not
// yet known. columns is the column count; each row contains nested cell Spans.
message SpanTable {
    optional int64 type_code = 1;
    optional int64 columns = 2;
    repeated SpanTableRow rows = 3;
}

// SpanTableRow is one table row: [start, end, cells]. Its content is a bare
// list of cell Spans, unlike an ordinary Span's content (which goes through
// the SpanContent leaf/group shape union), so it is not itself a Span.
message SpanTableRow {
    optional int64 start = 1;
    optional int64 end = 2;
    repeated Span cells = 3;
    SpanTableRowMeta meta = 4;
}

// SpanTableRowMeta is the [null, flag] trailer on table rows.
message SpanTableRowMeta {
    optional bool flag = 2 [(json_bool) = true];
}

// SpanImage is an inline image reference: [image_url, null, image_id].
message SpanImage {
    string image_url = 1;
    // Position 2 is null in observed captures; left unmodeled.
    string image_id = 3;
}

// Separator marks a zero-content boundary span. It is empty on the wire ([])
// but present, distinguishing a separator span from an ordinary one.
message Separator {
}

// SpanCodeBlock is a fenced code block within a rich-text document:
// [code_text, language]. Carried at Span position 7. Observed languages
// include "protobuf" and "go".
message SpanCodeBlock {
    string code = 1;
    optional string language = 2;
}

// SpanContent is a shape union: a span holds EITHER a text leaf (["text"] or
// ["text", marks]) OR a group of nested child spans ([[spans], ...]), at the
// same wire position. beprotojson selects the case by shape.
message SpanContent {
    oneof value {
        TextLeaf leaf = 1;                        // ["text", marks?]
        SpanGroup group = 2;                      // [[spans], meta?, null?, items?]
    }
}

// TextLeaf is the innermost span content: a run of text with optional
// positional formatting marks.
message TextLeaf {
    optional string text = 1;
    TextMarks marks = 2;                          // [null x7, bold?] positional flags
}

// SpanGroup is a container span's content: a list of child spans plus optional
// layout metadata.
message SpanGroup {
    repeated SpanElement spans = 1;                // [0] child spans or scalar leaves
    SpanGroupMeta meta = 2;                        // [1] e.g. [null, indent]
    // Field 3 ([2]) is null in observed captures; left unmodeled.
    ListItem list_item = 4;                       // [3] list-item style
}

// SpanElement is a shape union used by SpanGroup.spans. Most entries are the
// normal [start, end, content] Span shape, but some captures contain a bare
// integer leaf (for example 0 or 11) at the same repeated position.
message SpanElement {
    oneof value {
        int64 scalar = 1;
        Span span = 2;
    }
}

// TextMarks carries the positional formatting marks on a text leaf. Observed
// forms include [true] (flag1, on inline headings/labels), [null x7, true]
// (flag8, on code/identifier runs), and [null, null, null, url] (link, a
// hyperlink target). Boolean marks are carried as JSON booleans on the wire,
// not batchexecute's 1/0; exact bold/italic/code meanings are not yet
// confirmed, so they are modeled generically.
message TextMarks {
    optional bool flag1 = 1 [(json_bool) = true];
    optional bool flag2 = 2 [(json_bool) = true];
    optional bool flag3 = 3 [(json_bool) = true];
    string link = 4;                              // [3] hyperlink target URL
    TextMarkFontOrFlag flag_or_font = 5;
    TextMarkColorOrFlag flag_or_color = 6;
    optional bool flag7 = 7 [(json_bool) = true];
    optional bool flag8 = 8 [(json_bool) = true];
    optional bool flag9 = 9 [(json_bool) = true];  // observed true on code/identifier runs
    optional int64 style_code = 10;                // inferred style code; observed 2
}

// TextMarkFontOrFlag is a shape union. Position 5 is a boolean formatting
// flag in older spans and a [font_family, weight] tuple in styled rich text.
message TextMarkFontOrFlag {
    oneof value {
        bool flag = 1;
        TextMarkFont font = 2;
    }
}

message TextMarkFont {
    string family = 1;
    optional int32 weight = 2;
    optional int32 size = 3;
}

// TextMarkColorOrFlag is a shape union. Position 6 is a boolean formatting
// flag in older spans and an [red, green, blue] tuple in styled rich text.
message TextMarkColorOrFlag {
    oneof value {
        bool flag = 1;
        TextMarkColor color = 2;
    }
}

message TextMarkColor {
    optional int32 red = 1;
    optional int32 green = 2;
    optional int32 blue = 3;
}

// SpanGroupMeta is the [null, indent, flag?] metadata trailing a span group.
message SpanGroupMeta {
    // Position 1 is null in observed captures; left unmodeled.
    optional int64 indent = 2;
    // flag is seen true on at least one non-offline-resource notice span;
    // meaning not yet confirmed.
    optional bool flag = 3 [(json_bool) = true];
}

// ListItem describes one list-item run within a span group:
// [null, null, nesting, {101:bullet, ...}]. Positions 1 and 2 are null in
// observed captures.
message ListItem {
    // Fields 1 and 2 ([0], [1]) are null in observed captures; left unmodeled.
    optional int64 nesting = 3;                   // [2] nesting depth (0,1,2)
    ListItemMarker marker = 4;                    // [3] marker or shifted-marker metadata
    ListMarker trailing_marker = 5;               // [4] marker when field 4 is metadata
}

// ListItemMarker is a shape union. Most list items carry their sparse marker
// object directly at position 4. A newer variant carries [null,null,flag] at
// position 4 and shifts the sparse marker object to position 5.
message ListItemMarker {
    oneof value {
        ListItemMarkerEmpty empty = 1;
        ListItemMarkerMeta meta = 2;
        ListMarker marker = 3;
    }
}

message ListItemMarkerEmpty {
}

// ListItemMarkerMeta is the [null, null, flag] tuple in shifted-marker items.
message ListItemMarkerMeta {
    optional bool flag = 3 [(json_bool) = true];
}

// ListMarker is the list-item style object, carried on the wire as a sparse
// object keyed by field number: {"101":"•", "102":1, "103":1, "104":0}.
// The bullet glyph cycles •/◦/▪ with nesting. marker_kind distinguishes
// unordered (1) from ordered (2) markers; the other counters' exact meanings
// remain unconfirmed.
message ListMarker {
    option (object_encoded) = true;
    string bullet = 101;
    optional int64 marker_kind = 102;    // confirmed 1 for bullets, 2 for numbers
    optional int64 item_number = 103;    // inferred per-list item number
    optional int64 sequence_index = 104; // inferred zero/one-based sequence counter
}

// SourceAnnotation maps an offset range of the rendered document back to a
// source: [[source_id], [null, start, end]].
message SourceAnnotation {
    SourceIdList source = 1;                      // [0] [source_id]
    OffsetRange range = 2;                        // [1] [null, start, end]
}

// SourceIdList wraps a single source UUID in its own array ([source_id]).
message SourceIdList {
    string source_id = 1;
}

// OffsetRange is a [null, start, end] character span of the rendered document.
message OffsetRange {
    // Position 1 is null in observed captures; left unmodeled.
    optional int64 start = 2;
    optional int64 end = 3;
}

// GroundingRecord links reply spans to the source spans that ground them:
// [[source_id], [null, null, score, [reply_span], [source_spans], [ref],
// source_id]].
message GroundingRecord {
    SourceIdList source = 1;                      // [0] [source_id]
    Grounding grounding = 2;                      // [1] the grounding detail
}

// Grounding is the detail of a GroundingRecord:
// [null, null, score, [reply_span], [source_spans], [chunk_ref], source_id].
message Grounding {
    // Fields 1 and 2 ([0], [1]) are null in observed captures; left unmodeled.
    optional double score = 3;                    // [2] relevance score
    repeated OffsetRange reply_spans = 4;         // [3] spans in the reply
    SpanList source_spans = 5;                    // [4] [[span...]] in the source
    repeated ChunkRef chunk_refs = 6;             // [5] [[chunk_id], ref_id]
    SourceIdList source_id = 7;                    // [6] [source UUID]
}

// SpanList wraps a list of spans in one extra array layer ([[span...]]), the
// shape grounding uses for its source spans.
message SpanList {
    repeated Span spans = 1;
}

// ChunkRef is a [[chunk_id], ref_id] reference within a grounding record.
message ChunkRef {
    SourceIdList chunk = 1;
    string ref_id = 2;
}

// Interactive audio (WebRTC) types
// Reconstructed from JavaScript analysis and HAR captures.

// AgentCommsUserMessage is the protobuf transmitted over the WebRTC DataChannel
// for real-time bidirectional UI and transcript synchronization.
message AgentCommsUserMessage {
    AgentCommsMessageType type = 1;
    string content = 2;
    // Field 4 carries the typed event payload observed in live captures.
    AgentCommsPayload payload = 4;
}

enum AgentCommsMessageType {
    AGENT_COMMS_MESSAGE_TYPE_UNSPECIFIED = 0;
    USER_UTTERANCE = 1;     // Real-time text transcript of user's speech
    AGENT_UTTERANCE = 2;    // Real-time text transcript of AI host's speech
    TTS_EVENT = 3;          // Text-to-speech lifecycle hooks
    SEND_AUDIO_EVENT = 4;   // Audio payload transmission triggers
    GROUNDED_AGENT_CUSTOM_MESSAGE = 5;  // Control frame observed in live captures
    PLAYBACK_EVENT = 6;     // Client-side media playback state sync
    MICROPHONE_EVENT = 7;   // Microphone active/muted state sync
    STATUS_MESSAGE = 8;     // Connection diagnostics and state updates
}

message GroundedAgentCustomMessage {
    bytes raw = 1;
}

message StatusMessagePayload {
    // Field 1 carries the human-readable status string when present.
    string text = 1;
}

// AgentCommsPayload reconstructs the typed DataChannel payload at field 4.
// The sub-field numbers match AgentCommsMessageType values.
message AgentCommsPayload {
    UserUtterance user_utterance = 1;
    AgentUtterance agent_utterance = 2;
    TTSEvent tts_event = 3;
    SendAudioEvent send_audio_event = 4;
    GroundedAgentCustomMessage grounded_agent_custom_message = 5;
    PlaybackEvent playback_event = 6;
    MicrophoneEvent microphone_event = 7;
    StatusMessagePayload status_message = 8;
}

message UserUtterance {
    string transcript = 3;
    bool is_final = 4;
    string utterance_id = 5;
}

message AgentUtterance {
    int32 speaker_id = 1;
    repeated string speakers = 2;
    string transcript_text = 3;
    bool is_final = 4;
    string utterance_id = 5;
}

message TTSTimestamp {
    int64 epoch_sec = 1;
    int32 nanos = 2;
}

message TTSEvent {
    int32 event_type = 1;
    string utterance_id = 2;
    int32 segment_idx = 3;
    TTSTimestamp timestamp = 4;
}

message SendAudioEvent {
    int32 trigger_type = 1;
    string utterance_id = 2;
}

message PlaybackEvent {
    repeated string states = 1;
}

message MicrophoneEvent {
    int32 status_code = 1;
}

// FetchInteractivityToken (Of0kDd). HAR-verified
// (docs/captures/notebooklm.google.com.jsonl:24, 2026-04-06). Request
// is the empty payload []. Response is a 1-element JSON array whose
// [0] entry is a JSON-encoded string carrying the WebRTC bootstrap
// blob: lifetimeDuration, iceServers (STUN+TURN credentials),
// blockStatus, and iceTransportPolicy.
//
// Decoded by interactiveaudio.parseInteractivityTokenResponse
// (signaling.go:72) which JSON-unmarshals the inner string into a
// Go-side InteractivityToken struct that mirrors these fields.
message FetchInteractivityTokenRequest {
    optional int32 context_version = 1;
    RequestSurface context_surface = 3;
    RequestClientCaps context_caps = 4;
}

message FetchInteractivityTokenResponse {
    string lifetime_duration = 1;     // e.g. "86400s"
    repeated InteractivityICEServer ice_servers = 2;
    string block_status = 3;          // e.g. "NOT_BLOCKED"
    string ice_transport_policy = 4;  // e.g. "all"
}

message InteractivityICEServer {
    repeated string urls = 1;   // stun: and turn: URIs
    string username = 2;        // empty for STUN entries
    string credential = 3;      // empty for STUN entries
}

// Request/response messages for newly declared RPCs.
// Wire shapes are documented inline at the rpc declaration site.

// AddFileSource (o4cbdc): register an uploaded file as a notebook
// source. HAR-verified across two pdf-upload captures (2026-04-19,
// pdf-upload/, pdf-upload-new/) — both byte-identical for the
// trailing options blob.
//
// Wire request:
//   [[[filename]], project_id, [2], [1, null × 9, [1]]]
//
// Position [0] is a 2-level-nested filename list (the inner [filename]
// is a 1-element list). Position [2] is [2] = source_type=file_upload.
// Position [3] is the same fixed options blob seen in DeleteArtifact's
// V5N4be call. See api.Client.registerFileSource (client.go:952).
message AddFileSourceRequest {
    string project_id = 1;
    string filename = 2;
}

// Wire response (HAR-verified):
//   [[[[source_id], filename, [null, null, null, null, 0]]],
//    null,
//    [[[[source_id], filename, [null, null, null, null, 0]]]]]
//
// Positions [0] and [2] both echo the assigned source row; [1] is
// always null in the captured calls. The inner metadata list at
// position [2] of each row is [null × 4, status_int=0]. We surface
// the source_id only.
message AddFileSourceResponse {
    string source_id = 1;
    string filename = 2;
}

// DeleteChatTurns is inferred from the bundle binding and the fact that
// J7Gthc fires before feedback. The observed wire has four positions.
message DeleteChatTurnsRequest {
    ChatStreamOptions options = 1;
    string conversation_id = 2;
    // Field 3 is null in observed requests.
    int32 unknown_4 = 4; // semantics unconfirmed
}

