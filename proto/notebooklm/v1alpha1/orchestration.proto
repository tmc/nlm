// InteractionEventService records UI interactions that do not mutate the
// artifact itself. The binding and method name are taken from the production
// JavaScript descriptor for HpN0Ub.
service InteractionEventService {
    option (batchexecute_app) = "LabsTailwindUi";
    option (batchexecute_host) = "notebooklm.google.com";

    rpc LogInteractionEvent(LogInteractionEventRequest) returns (google.protobuf.Empty) {
        option (rpc_id) = "HpN0Ub";
        option (arg_format) = "[%context%, %event_2%, %event_3%, %event_4%]";
    }
}

// Request messages reconstructed from captured batchexecute traffic.
message CreateProjectRequest {
    string title = 1;
    string emoji = 2;
}

message DeleteProjectsRequest {
    repeated string project_ids = 1;
}

message DeleteSourcesRequest {
    repeated SourceIdList source_ids = 1;
    RequestContext context = 2;
}

message GetProjectRequest {
    string project_id = 1;
    // Field 2 is null in observed requests.
    RequestContext context = 3;
    // Field 4 is null in observed requests.
    optional int32 include_artifacts = 5;
    GetProjectFilter filter = 6;
}

message GetProjectFilter {
    GetProjectFilterEntry entry = 1;
}

message GetProjectFilterEntry {
    // Fields 1 and 2 are null in observed requests.
    StringList values = 3;
}

// LogInteractionEventRequest is the HpN0Ub request. The UI uses distinct
// positional event fields for different artifact interactions; each carries
// the affected artifact ID in a one-element message.
message LogInteractionEventRequest {
    InteractionEventContext context = 1;
    InteractionEventTarget event_2 = 2;
    InteractionEventTarget event_3 = 3;
    InteractionEventTarget event_4 = 4;
}

message InteractionEventContext {
    optional int32 version = 1; // observed 2
    // Field 2 is null in every observed request.
    InteractionEventSurface surface = 3;
    RequestClientCaps caps = 4;
    RequestArtifactTypeFilter artifact_types = 5;
}

message InteractionEventSurface {
    optional int32 value = 1; // observed 1
}

message InteractionEventTarget {
    string artifact_id = 1;
}

// ListRecentlyViewedProjectsRequest has two captured wire variants. The live
// command uses the short [null, 1, null, [2]] form. Full web requests carry
// [project_id, null, context, null, 0, filter]; older full requests instead
// put context at field 4 and page 1 at field 2.
message ListRecentlyViewedProjectsRequest {
    string project_id = 1;
    optional int32 page = 2;                 // observed 1
    RequestContext context = 3;
    RequestContext legacy_context = 4;
    optional int32 unknown_5 = 5; // observed 0
    ListRecentlyViewedProjectsFilter filter = 6;
}

message ListRecentlyViewedProjectsFilter {
    // Group semantics are unconfirmed because every observed list is empty.
    ListRecentlyViewedProjectsFilterA filter_group_a = 1; // [null, null, []]
    ListRecentlyViewedProjectsFilterB filter_group_b = 2; // [[]]
    ListRecentlyViewedProjectsFilterC filter_group_c = 3; // [null, []]
}

// The three filter sub-messages each carry a single present-but-empty list.
// The list is wrapped in a StringList message so a present (non-nil) wrapper
// round-trips as [] rather than collapsing to null (an empty bare repeated
// field is indistinguishable from absent in proto3).
message ListRecentlyViewedProjectsFilterA {
    // fields 1-2 null; field 3 a present-but-empty string list.
    StringList values = 3;
}

message ListRecentlyViewedProjectsFilterB {
    StringList values = 1;
    // Present-but-empty in the full web request variant.
    StringList unknown_3 = 3;
}

message ListRecentlyViewedProjectsFilterC {
    // Present-but-empty in the full web request variant.
    StringList unknown_1 = 1;
