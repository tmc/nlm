}

// Account management
message GetOrCreateAccountRequest {
    optional int32 context_version = 1;
    RequestSurface context_surface = 3;
    RequestClientCaps context_caps = 4;
}

message MutateAccountRequest {
    MutateAccountUpdateEnvelope update = 1;
    RequestContext context = 2;
}

// MutateAccountUpdateEnvelope wraps the update at field 1.
message MutateAccountUpdateEnvelope {
    MutateAccountUpdate update = 1;
}

// MutateAccountUpdate is [null, [change...]]. Pair semantics are unconfirmed.
message MutateAccountUpdate {
    repeated MutateAccountChange changes = 2;
}

// MutateAccountChange carries a capability set at field 5.
message MutateAccountChange {
    MutateAccountCapabilitySet capability_set = 5;
}

// MutateAccountCapabilitySet is [null, null, null, [pair...]].
message MutateAccountCapabilitySet {
    repeated MutateAccountCapabilityPair pairs = 4;
}

// MutateAccountCapabilityPair is an observed two-integer capability pair.
message MutateAccountCapabilityPair {
    int32 first = 1;
    int32 second = 2;
}

// Account: [account_id, limits, settings, unknown_4, unknown_5]. Field 2 was
// previously modeled as an "email" string, but the wire carries a
// [tier, notebook_limit, source_limit, upload_limit, tier] quota array
// instead (see AccountLimits; confirmed against the hand-written
// AccountStatus decoder in internal/notebooklm/api/account.go, which reads
// the same ZwVcOc response positionally). No live code reads Account.email,
// so the field is replaced rather than kept alongside the real shape.
message Account {
    string account_id = 1;
    AccountLimits limits = 2;
    AccountSettings settings = 3;
    AccountFlags flags = 4;   // [3] observed [[1]]; code meaning unconfirmed
    AccountBanner banner = 5; // [4] observed [true,1,3,6,true]
}

// AccountLimits is the [tier, notebook_limit, source_limit, upload_limit,
// tier] quota array at Account field 2. Position 1 and 5 both carry the same
// tier value in observed captures.
message AccountLimits {
    optional int64 tier = 1;
    optional int64 notebook_limit = 2;
    optional int64 source_limit = 3;
    optional int64 upload_limit = 4;
    optional int64 tier_2 = 5;
}

message AccountSettings {
    optional bool email_notifications = 1 [(json_bool) = true];
    string default_project_emoji = 2;
    // Field 3 ([2]) is null in observed captures; left unmodeled.
    // Meanings of the three preference flags are unconfirmed.
    optional bool primary_preference_flag = 4 [(json_bool) = true];
    AccountSettingsDetail rules = 5; // [4] observed [null,null,null,[[2,2,1]]]
    // Field 6 ([5]) is null in observed captures; left unmodeled.
    optional bool secondary_preference_flag = 7 [(json_bool) = true];
    // Field 8 ([7]) is null in observed captures; left unmodeled.
    optional bool tertiary_preference_flag = 9 [(json_bool) = true];
}

// AccountSettingsDetail is the nested message at AccountSettings field 5:
// [null, null, null, [[2,2,1]]]. Only field 4 (a repeated AccountSettingsRule)
// is populated in observed captures.
message AccountSettingsDetail {
    // Fields 1-3 ([0]-[2]) are null in observed captures; left unmodeled.
    repeated AccountSettingsRule rules = 4; // [3] observed [[2,2,1]]
}

// AccountSettingsRule is a [2, 2, 1] positional triple within
// AccountSettingsDetail.rules. Meaning of the three integers is not yet
// confirmed.
message AccountSettingsRule {
    optional int64 rule_code = 1;
    optional int64 value_code = 2;
    optional int64 state_code = 3;
}

// AccountFlags is the Account field 4 message: [[1]], a single repeated
// int64 field.
message AccountFlags {
    repeated int64 codes = 1; // individual code meanings unconfirmed
}

// AccountBanner is the Account field 5 message: [true, 1, 3, 6, true].
// Meaning of the individual fields is not yet confirmed.
message AccountBanner {
    // Descriptive positional names only; individual meanings are unconfirmed.
    optional bool leading_flag = 1 [(json_bool) = true];
    optional int64 code_a = 2;
    optional int64 code_b = 3;
    optional int64 code_c = 4;
    optional bool trailing_flag = 5 [(json_bool) = true];
}

// Service definition
service LabsTailwindOrchestrationService {
    option (batchexecute_app) = "LabsTailwindUi";
    option (batchexecute_host) = "notebooklm.google.com";
    
    // Artifact operations
    rpc CreateArtifact(CreateArtifactRequest) returns (Artifact) {
        option (rpc_id) = "xpWGLf";
        option (arg_format) = "[%context%, %project_id%, %artifact%]";
    }
    // GetArtifact (v9rmvd). The JS bundle binds v9rmvd to
    // /LabsTailwindOrchestrationService.GetArtifact, so the RPC does
    // exist on the wire — it just isn't invoked by the live web UI,
    // which prefers gArtLc (ListArtifacts) + client-side filter for
    // its rendering path. The earlier BnLyuf id was a different,
    // unreachable inference that returned 400.
    //
    // Direct captures use [artifact_id, context]. The live API retains its
    // positional parser as the projection oracle.
    rpc GetArtifact(GetArtifactRequest) returns (Artifact) {
        option (rpc_id) = "v9rmvd";
        option (arg_format) = "[%artifact_id%, %context%]";
    }
    rpc UpdateArtifact(UpdateArtifactRequest) returns (Artifact) {
        option (rpc_id) = "DJezBc";
        option (arg_format) = "[%artifact%, %update_mask%]";
    }
    rpc RenameArtifact(RenameArtifactRequest) returns (Artifact) {
        option (rpc_id) = "rc3d8d";
        // Manual encoder in gen/method/LabsTailwindOrchestrationService_RenameArtifact_encoder.go
        // Format: [[artifactID, newTitle], [["title"]]]
    }
    rpc DeleteArtifact(DeleteArtifactRequest) returns (google.protobuf.Empty) {
        // HAR-verified 2026-04-07 against project
        // 00000000-0000-4000-8000-000000000005 (two successive deletes,
        // byte-identical options blob; both returned []). Earlier
        // WxBZtb inference returned 400 against the live server.
        // See rpc.go:125 and
        // internal/method/LabsTailwindOrchestrationService_DeleteArtifact_encoder.go.
        //
        // Wire shape (custom Go encoder; arg_format cannot express the
        // fixed-sentinel options blob):
        //   [[2, null, null, [1, null × 9, [1]], [[1,4,2,3,6,5]]],
        //    artifact_id]
        // Position [0] is the same options blob carried by AddFileSource
        // (o4cbdc) — Google's pattern for "this is a write-against-the-
        // notebook" calls.
        option (rpc_id) = "V5N4be";
    }
    rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse) {
        // The web UI reads the artifact list via gArtLc (QueryArtifacts).
        // No distinct LfTXoe wire call has been observed; the earlier ID
        // is treated as dead. See rpc.go:126.
        option (rpc_id) = "gArtLc";
        // Encoder note: the live path hand-builds a truncated [[2], project_id]
        // form (api.Client.ListArtifacts); this arg_format matches the fuller
        // web-UI request the message now models. project_id at position 1;
        // the client-context preamble and filter are supplied by callers that
        // populate the message.
        option (arg_format) = "[%context%, %project_id%, %filter%]";
    }
    rpc QueryArtifacts(QueryArtifactsRequest) returns (QueryArtifactsResponse) {
        option (rpc_id) = "gArtLc";
        option (arg_format) = "[%artifact_types%, %project_id%, %filter%]";
    }

    // Source operations
    rpc ActOnSources(ActOnSourcesRequest) returns (google.protobuf.Empty) {
        option (rpc_id) = "yyryJe";
        option (arg_format) = "[%project_id%, %action%, %source_ids%]";
    }
    // AddSources (izAoDd). HAR (more-requests3) shows the reply is a list
    // containing the same Source descriptor LoadSource (hizoJc) returns:
    //   [ [source_id], title, [source_metadata], [null,2], ... ]
    // not a Project envelope.
    rpc AddSources(AddSourceRequest) returns (AddSourcesResponse) {
        option (rpc_id) = "izAoDd";
        option (arg_format) = "[%sources%, %project_id%, [2, null, [1], [1, null, null, null, null, null, null, null, null, null, [1, 3]]]]";
    }
    rpc CheckSourceFreshness(CheckSourceFreshnessRequest) returns (CheckSourceFreshnessResponse) {
