    // Opaque pagination/resume cursor returned after the message list.
    string cursor = 2;
}

message DeleteChatHistoryRequest {
    // Wire format: [%context%, null, %project_id%]
    // Polymorphic endpoint shared with PollDeepResearch
    RequestContext context = 1;
