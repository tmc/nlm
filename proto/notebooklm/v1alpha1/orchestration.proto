// GenerateArtifactSuggestions / AudioTopicSuggestions (otmP3b).
// HAR-verified for kind=2 (audio) via the create-audio capture used
// for internal/method/labs_tailwind_artifact_suggestions.go (filed
// 2026-04-14; not present in this repo's docs/captures/ but the
// encoder is the durable record).
//
// Wire request: [[kind], project_id, [[src1], [src2], ...], variation]
// Wire response: [[[title, description], [title, description], ...]]
//
// Each call returns three suggestion pairs. variation is a re-roll
// seed (1, 2, 5, 6 observed); the UI bumps it on every "refresh"
// click. Video and slide kinds are not yet HAR-verified.
