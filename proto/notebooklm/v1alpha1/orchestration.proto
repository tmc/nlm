// UpdateProjectUserState (LQhfEb). wire shape unverified.
// UpdateProjectUserStateRequest wire (HAR-verified, more-requests2):
//   [<RequestContext>, project_id, [null, [null, 2]], [["<state_key>"]]]
// Field 3 carries the new state value (a nested [null, 2] message); field 4
// is the list of state keys being updated
// (e.g. "notebook_lm_state.saved_source_panel_view").
message UpdateProjectUserStateRequest {
    RequestContext context = 1;
    string project_id = 2;
    UpdateProjectUserStateValue value = 3;
    UpdateProjectUserStateKeys keys = 4;
}

// UpdateProjectUserStateValue is field 3: [null, [null, 2]].
message UpdateProjectUserStateValue {
    // field 1 ([0]) is null in the observed capture; left unmodeled.
    UpdateProjectUserStateValueInner detail = 2;
}

message UpdateProjectUserStateValueInner {
    // Pinned-state requests carry numeric 1 here; saved-panel requests carry null.
    optional int32 pinned = 1;
    optional int32 value = 2; // confirmed state value; observed 2
}

// UpdateProjectUserStateKeys is field 4: [["notebook_lm_state...."]]. Field 1
// is the repeated list of dotted state-key paths being updated
// (e.g. "notebook_lm_state.saved_source_panel_view").
message UpdateProjectUserStateKeys {
    repeated string keys = 1;
}

// UpdateProjectUserStateResponse: the wire carries a nested result message
// at field 2 ([null, [null, 2]]), not an empty envelope.
message UpdateProjectUserStateResponse {
    UpdateProjectUserStateResult result = 2;
}

message UpdateProjectUserStateResult {
    // Pinned-state responses carry true here; saved-panel responses carry null.
    optional bool pinned = 1 [(json_bool) = true];
    int32 status = 2;
}

