// Orchestration service definitions discovered from JavaScript analysis
syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/empty.proto";
import "notebooklm/v1alpha1/rpc_extensions.proto";
import "notebooklm/v1alpha1/notebooklm.proto";

package notebooklm.v1alpha1;

option go_package = "github.com/tmc/nlm/gen/notebooklm/v1alpha1;notebooklm";

// Additional messages for orchestration

message Context {
    // Context information, structure inferred from usage
    string project_id = 1;
    repeated string source_ids = 2;
}

// RequestContext is the client-capabilities preamble the web UI prepends to
// most orchestration requests. Observed as [2, null, null, [1, null×8, [1]]]
// — with an extra artifact-type filter list at field 5 in ListArtifacts.
message RequestContext {
    // Observed constant 2 (protocol/surface version).
    optional int32 version = 1;
    // Field 2 ([1]) is null in every observed request.
    RequestSurface surface = 3;
    RequestClientCaps caps = 4;
    // ListArtifacts prepends the requested artifact-type filter here, e.g.
    // [[1, 4, 8, 10, 2, 3, 6, 9]]; absent (null) on other requests.
    RequestArtifactTypeFilter artifact_types = 5;
}

// RequestSurface is the optional [1] marker carried by some UI reads.
message RequestSurface {
    optional int32 value = 1;
}

// RequestClientCaps is RequestContext field 4: [1, null×9, [1]] (11 elements).
message RequestClientCaps {
    optional int32 version = 1; // inferred capability-envelope version; observed 1
    // Fields 2-10 ([1]-[9]) are null in every observed request; left unmodeled.
    repeated int32 capability_codes = 11; // observed [1]; code meaning unconfirmed
}

// RequestArtifactTypeFilter is RequestContext field 5: [[1,4,8,10,2,3,6,9]].
message RequestArtifactTypeFilter {
    repeated int32 types = 1;
}

// Artifact is the gArtLc (ListArtifacts/QueryArtifacts) row shape. Fields
// Fields 7-19 are a de-facto oneof keyed by type: exactly one of note,
// audio_overview, video_preview, report_config, mindmap_preview,
// slide_deck_preview, flashcard_config is populated per artifact, matching
// ArtifactType. These are each artifact-tree-local message shapes distinct
// from the top-level AudioOverview/VideoOverview/Report messages used by the
// Create*/Get* RPCs — the field numbers coincide but the wire shapes do not
// (AudioOverview.content/instructions are plain strings there; here they are
// structured payloads). See ArtifactAudioOverview etc. below.
message Artifact {
    string artifact_id = 1;
    string title = 2;
    ArtifactType type = 3;
    repeated ArtifactSource sources = 4;
    ArtifactState state = 5;
    // Field 6 is null in every observed capture; left unmodeled.
    ArtifactNotePreview note = 7;                    // type NOTE
    ArtifactAudioOverview audio_overview = 8;         // type AUDIO_OVERVIEW
    ArtifactVideoPreview video_preview = 9;           // type VIDEO_OVERVIEW
    ArtifactReportConfig tailored_report = 10;        // type REPORT
    // update_time is populated on every artifact regardless of type; it is
    // always >= create_time (field 16).
    google.protobuf.Timestamp update_time = 11;
    // Fields 12-14 are null in every observed capture; left unmodeled.
    ArtifactMindMapPreview mindmap_preview = 15;      // type 7 (mind map / infographic)
    google.protobuf.Timestamp create_time = 16;
    ArtifactSlideDeckPreview slide_deck_preview = 17; // type 8 (slide deck)
    // Field 18 carries a wrapped list of timestamp rows, observed
    // [[[1388, 553000000]]] on a failed NOTE artifact. The inner [secs, nanos]
    // is a Timestamp; meaning (a processing duration or retry marker) is
    // unconfirmed, so it is modeled generically.
    ArtifactTimestamps processing_timestamps = 18; // inferred processing/retry times
    ArtifactFlashcardConfig flashcard_config = 19;    // type 9 (flashcards)
    // Inferred schema/version marker; constant 1 in every observed capture.
    int64 schema_version = 20;
    // App's real wire position on gArtLc has never been observed (no type-5
    // artifact has appeared in any capture); field 10 was a guess that
    // collided with the now-confirmed tailored_report position, so App is
    // parked here pending a HAR that actually contains one.
    App app = 21;
    // update_cursor is a string encoding of update_time (field 11) as
    // base64("{seconds}-{nanos}"), e.g. base64("1784614281-797501000").
    // Likely an opaque sort/pagination cursor; kept generic since its use is
    // unconfirmed.
    string update_cursor = 22;
    string viewer_url = 24;
    ArtifactFileDetails file_details = 25;
}

// ArtifactFileDetails is the five-string trailer returned by direct
// GetArtifact reads. The field meanings beyond filename and MIME type are
// unconfirmed; URLs are retained independently for lossless round-tripping.
message ArtifactFileDetails {
    string filename = 1;
    string mime_type = 2;
    string url_3 = 3;
    string url_4 = 4;
    string url_5 = 5;
}

// ArtifactTimestamps is the wrapped list carried at Artifact field 18:
// [[ [secs, nanos] ]] — an outer list of rows, each row an inline
// [seconds, nanos] pair (not a google.protobuf.Timestamp sub-message).
message ArtifactTimestamps {
    repeated ArtifactTimestampRow rows = 1;
}

message ArtifactTimestampRow {
    optional int64 seconds = 1;
    optional int64 nanos = 2;
}

enum ArtifactType {
    ARTIFACT_TYPE_UNSPECIFIED = 0;
    ARTIFACT_TYPE_NOTE = 1;
    ARTIFACT_TYPE_AUDIO_OVERVIEW = 2;
    ARTIFACT_TYPE_VIDEO_OVERVIEW = 3;  // Video overview (confirmed from /tmp/notebooklm3.har)
    ARTIFACT_TYPE_REPORT = 4;
    ARTIFACT_TYPE_APP = 5;
    // 6 unobserved.
    ARTIFACT_TYPE_7 = 7;   // mind map / infographic (see ArtifactMindMapPreview)
    ARTIFACT_TYPE_8 = 8;   // slide deck (see ArtifactSlideDeckPreview)
    ARTIFACT_TYPE_9 = 9;   // flashcards (see ArtifactFlashcardConfig)
}

enum ArtifactState {
    ARTIFACT_STATE_UNSPECIFIED = 0;
    ARTIFACT_STATE_CREATING = 1;
    ARTIFACT_STATE_READY = 2;
    ARTIFACT_STATE_FAILED = 3;
    ARTIFACT_STATE_SUGGESTED = 4;
    ARTIFACT_STATE_7 = 7;
    ARTIFACT_STATE_8 = 8;
    ARTIFACT_STATE_9 = 9;
}

message ArtifactSource {
    SourceId source_id = 1;
    repeated TextFragment text_fragments = 2;
    // Semantics unconfirmed. Observed as 8 on artifact sources.
    int32 unknown_3 = 3;
}

message TextFragment {
    string text = 1;
    int32 start_offset = 2;
    int32 end_offset = 3;
}

message Report {
    string title = 1;
    string content = 2;
    repeated Section sections = 3;
}

message Section {
    string title = 1;
    string content = 2;
}

message App {
    string app_id = 1;
    string name = 2;
    string description = 3;
}

// ArtifactDownloadVariant is one rendered-output link for an artifact
// preview: a URL plus an integer format code and (for audio) a MIME type.
// [url, format_code, mime_type?]
message ArtifactDownloadVariant {
    string url = 1;
    int64 format_code = 2;
    string mime_type = 3;
}

// ArtifactNotePreview is the type-NOTE gArtLc payload at Artifact field 7:
// [null, config, thumbnail_url, thumbnail_url_2, has_audio?, download_variants, duration]
message ArtifactNotePreview {
    // Field 1 is null in every observed capture; left unmodeled.
    ArtifactNoteConfig config = 2;
    string thumbnail_url = 3;
    string thumbnail_url_2 = 4;
    optional bool has_audio = 5 [(json_bool) = true];
    repeated ArtifactDownloadVariant download_variants = 6;
    // duration is present-but-empty ([]) when there is no audio rendition
    // yet, so it is wrapped in a message: a present TimestampPair marshals to
    // [] when its own seconds/nanos are unset, instead of collapsing to null.
    TimestampPair duration = 7;
}

// TimestampPair wraps a [seconds, nanos] pair so it can be present-but-empty
// ([]) on the wire, distinct from being absent (null).
message TimestampPair {
    optional int64 seconds = 1;
    optional int64 nanos = 2;
}

// ArtifactNoteConfig is the [null, const, null, source_refs, language, flag,
// int] config blob inside ArtifactNotePreview.
message ArtifactNoteConfig {
    // Field 1 is null in every observed capture; left unmodeled.
    optional int64 mode = 2;  // constant 2 in every observed capture
    // Field 3 is null in every observed capture; left unmodeled.
    repeated SourceIdList source_refs = 4;
    string language = 5;
    optional bool flag = 6 [(json_bool) = true];
    optional int64 format_code = 7; // inferred format selector
}

// ArtifactAudioOverview is the type-AUDIO_OVERVIEW gArtLc payload at
// Artifact field 8: [markdown_status, content, instructions]. This is a
// different shape than the top-level AudioOverview message (whose content
// and instructions are plain strings on Create/GetAudioOverview).
message ArtifactAudioOverview {
    string status = 1;                        // rendered markdown, not a status code
    ArtifactAudioContent content = 2;
    RichDocument instructions = 3;             // same rich-text tree as chat rich_content
}

// ArtifactAudioContent is the [topic, description, null, source_refs,
// language, prompt, length?, flag] generation-options blob at
// ArtifactAudioOverview field 2.
message ArtifactAudioContent {
    string topic = 1;               // e.g. "Blog Post"
    string description = 2;
    // Field 3 is null in every observed capture; left unmodeled.
    repeated SourceIdList source_refs = 4;
    string language = 5;
    string prompt = 6;
    optional int64 length = 7;
    optional bool flag = 8 [(json_bool) = true];
}

// ArtifactVideoPreview is the type-VIDEO_OVERVIEW gArtLc payload at Artifact
// field 9: [status?, thumbnail_url, content, video_url, download_variants,
// duration]. Unlike ArtifactAudioOverview, this was previously mismodeled as
// the unrelated Report message (field 9 used to be declared `Report
// tailored_report`), which is why the wire's positions 4-6 showed up as
// Report.unknown_4/5/6 in earlier verify runs.
message ArtifactVideoPreview {
    // Field 1 is null in every observed capture; left unmodeled.
    string thumbnail_url = 2;
    ArtifactVideoContent content = 3;
    string video_url = 4;
    repeated ArtifactDownloadVariant download_variants = 5;
    // duration is [seconds, nanos].
    repeated int64 duration = 6;
}

// ArtifactVideoContent is the [source_refs, language, topic?, null, length,
// unknown_6?, null, flag?] generation-options blob at ArtifactVideoPreview
// field 3, the same family of shape as ArtifactAudioContent (a source-ref
// list plus language/topic/length/flag), but with source_refs and
// language/topic swapped in position relative to the audio variant. The
// array length varies (5, 6, or 8 observed) as trailing fields are omitted
// when unset, so every field past source_refs/language is optional.
message ArtifactVideoContent {
    repeated SourceIdList source_refs = 1;
    string language = 2;
    string topic = 3;
    // Field 4 is null in every observed capture; left unmodeled.
    optional int64 length = 5;
    optional int64 format_code = 6; // inferred format selector
    // Field 7 is null in every observed capture; left unmodeled.
    // flag is carried as an int (1), not a JSON bool, unlike similarly named
    // fields elsewhere.
    optional bool flag = 8;
}

// ArtifactReportConfig is the type-REPORT gArtLc payload at Artifact field
// 10: ["", [report_type, null, description_or_instructions, language, null,
// null, length_range_a?, length_range_b?, flag]]. The leading string is
// empty in every observed capture.
message ArtifactReportConfig {
    // Meaning unconfirmed; an explicit empty string in every observed capture.
    optional string leading_text = 1;
    ArtifactReportOptions options = 2;
    // Confirmed string carrying JSON. Inferred to be a mind-map node tree.
    string mind_map_data_json = 4;
}

message ArtifactReportOptions {
    optional int64 report_type = 1;
    // Field 2 is null in every observed capture; left unmodeled.
    string instructions = 3;         // custom prompt, or the report topic when no instructions were given
    string language = 4;
    // Fields 5, 6 are null in every observed capture; left unmodeled.
    // length_range_a and length_range_b are never both populated in the same
    // capture; which one is used appears to depend on report_type (a=1 pairs
    // with report_type 1, b=2 with report_type 2), so both are kept as
    // distinct optional positions rather than merged.
    repeated int64 length_range_a = 7; // e.g. [2, 2]
    repeated int64 length_range_b = 8; // e.g. [2, 2]
    optional bool flag = 9 [(json_bool) = true];
}

// ArtifactMindMapPreview is the type-7 (mind map / infographic) gArtLc
// payload at Artifact field 15: [config, title, [slide]].
message ArtifactMindMapPreview {
    ArtifactMindMapConfig config = 1;
    string title = 2;
    repeated ArtifactMindMapSlide slides = 3;
}

// ArtifactMindMapConfig is the [null, language, null, int, int, int] config
// blob at ArtifactMindMapPreview field 1. orientation_code is inferred from
// the generated image dimensions; the remaining code meanings are unconfirmed.
message ArtifactMindMapConfig {
    // prompt is present for some custom mind maps and null for others.
    string prompt = 1;
    string language = 2;
    // Field 3 is null in every observed capture; left unmodeled.
    // Observed 1 for landscape images and 2 for portrait images.
    optional int64 orientation_code = 4;
    optional int64 style_code = 5;    // inferred visual-style selector
    optional int64 template_code = 6; // inferred template selector
}

// ArtifactMindMapSlide is one [title, [url, width, height], description,
// text] entry in ArtifactMindMapPreview.slides.
message ArtifactMindMapSlide {
    string title = 1;
    ArtifactMindMapImageRef thumbnail = 2;
    string description = 3;
    string text = 4;
}

// ArtifactMindMapImageRef is a [url, width, height] image reference. Unlike
// ArtifactImageRef (the slide-deck variant), width/height are carried as
// integers here, not numeric strings.
message ArtifactMindMapImageRef {
    string url = 1;
    optional int64 width = 2;
    optional int64 height = 3;
}

// ArtifactSlideDeckPreview is the type-8 (slide deck) gArtLc payload at
// Artifact field 17: [config, title, [slide_image], download_url,
// download_url_2].
message ArtifactSlideDeckPreview {
    ArtifactSlideDeckConfig config = 1;
    string title = 2;
    repeated ArtifactSlideImage slides = 3;
    string download_url = 4;
    string download_url_2 = 5;
    ArtifactSlideEditInstructions edit_instructions = 6;
}

// ArtifactSlideEditInstructions is the per-slide revision-request blob at
// ArtifactSlideDeckPreview position [5] (field 6): [[[slide_index, text], ...]].
// Each entry pairs a zero-based slide index with the user's edit instruction
// for that slide (e.g. [0, "simplify this slide"]). Present only on slide-deck
// artifacts the user has requested edits on; absent otherwise. Surfaced by a
// gArtLc (QueryArtifacts) poll capture; the list is wrapped one level deep.
message ArtifactSlideEditInstructions {
    repeated ArtifactSlideEditInstruction instructions = 1;
}

// ArtifactSlideEditInstruction is one [slide_index, text] revision-request
// pair.
message ArtifactSlideEditInstruction {
    optional int64 slide_index = 1;
    string text = 2;
}

// ArtifactSlideDeckConfig is the [null, language, format, length] config
// blob at ArtifactSlideDeckPreview field 1, mirroring the [format, length]
// pair EncodeCreateSlideDeckArgs sends on create (see
// internal/method/labs_tailwind_overview_custom.go SlideDeckFormat).
message ArtifactSlideDeckConfig {
    // Observed as a user-provided string; meaning unconfirmed.
    string unknown_1 = 1;
    string language = 2;
    optional int64 format = 3;
    optional int64 length = 4;
}

// ArtifactSlideImage is one [[url, width, height], description, text] entry
// in ArtifactSlideDeckPreview.slides.
message ArtifactSlideImage {
    ArtifactImageRef image = 1;
    string description = 2;
    string text = 3;
}

// ArtifactImageRef is a [url, width, height] image reference.
message ArtifactImageRef {
    string url = 1;
    optional int64 width = 2;
    optional int64 height = 3;
}

// ArtifactFlashcardConfig is the type-9 (flashcards) gArtLc payload at
// Artifact field 19: [null, [null, language]].
message ArtifactFlashcardConfig {
    // extracted_content is the source-derived rich-text document some
    // flashcard decks carry (e.g. an extracted API reference table); null on
    // the majority of captures.
    RichDocument extracted_content = 1;
    ArtifactFlashcardOptions options = 2;
}

message ArtifactFlashcardOptions {
    // Field 1 is null in every observed capture; left unmodeled.
    string language = 2;
}

// Request/Response messages for LabsTailwindOrchestrationService

message CreateArtifactRequest {
    Context context = 1;
    string project_id = 2;
    Artifact artifact = 3;
}

// GetArtifactRequest is [artifact_id, context].
message GetArtifactRequest {
    string artifact_id = 1;
    RequestContext context = 2;
}

message UpdateArtifactRequest {
    Artifact artifact = 1;
    google.protobuf.FieldMask update_mask = 2;
}

message RenameArtifactRequest {
    string artifact_id = 1;
    string new_title = 2;
}

message DeleteArtifactRequest {
    string artifact_id = 1;
}

// ListArtifactsRequest wire (HAR-verified, more-requests2):
//   [<RequestContext>, project_id, "<filter>"]
// where RequestContext.artifact_types carries the type filter and field 3 is a
// CEL-ish filter string (e.g. NOT artifact.status = "ARTIFACT_STATUS_SUGGESTED").
// The live api.Client.ListArtifacts hand-builds a truncated [[2], project_id]
// form and does not use this message as an encoder.
message ListArtifactsRequest {
    RequestContext context = 1;
    string project_id = 2;
    string filter = 3;
}

message ListArtifactsResponse {
    repeated Artifact artifacts = 1;
    string next_page_token = 2;
}

message QueryArtifactsRequest {
    repeated int32 artifact_types = 1;
    string project_id = 2;
    string filter = 3;
}

message QueryArtifactsResponse {
    repeated Artifact artifacts = 1;
}

message ActOnSourcesRequest {
    string project_id = 1;
    string action = 2;
    repeated string source_ids = 3;
}

// Audio style types (confirmed from sqTeoe RPC in HAR analysis)
enum AudioType {
    AUDIO_TYPE_UNSPECIFIED = 0;
    AUDIO_TYPE_DEEP_DIVE = 1;      // "A lively conversation between two hosts, unpacking and connecting topics"
    AUDIO_TYPE_BRIEF = 2;          // "A bite-sized overview to help you grasp the core ideas quickly"
    AUDIO_TYPE_CRITIQUE = 3;       // "An expert review offering constructive feedback"
    AUDIO_TYPE_DEBATE = 4;         // "A thoughtful debate illuminating different perspectives"
}

// Audio length options (confirmed from /tmp/notebooklm2.har analysis)
enum AudioLength {
    AUDIO_LENGTH_UNSPECIFIED = 0;
    AUDIO_LENGTH_SHORT = 1;        // Shorter audio overview
    AUDIO_LENGTH_DEFAULT = 2;      // ~10-15 minutes
    AUDIO_LENGTH_LONG = 3;         // ~15-20 minutes (longer)
}

// Video style options (confirmed from /tmp/notebooklm3.har analysis)
enum VideoStyle {
    VIDEO_STYLE_UNSPECIFIED = 0;
    VIDEO_STYLE_AUTOSELECT = 1;    // Let system choose the best style
    VIDEO_STYLE_CLASSIC = 2;       // Classic presentation style
    VIDEO_STYLE_WHITEBOARD = 3;    // Whiteboard-style presentation
}

// Guide type for GenerateNotebookGuide (confirmed from /tmp/notebooklm3.har analysis)
enum GuideType {
    GUIDE_TYPE_UNSPECIFIED = 0;
    GUIDE_TYPE_OUTLINE = 1;        // Text outline
    GUIDE_TYPE_MIND_MAP = 2;       // Mind map visualization
}

message CreateAudioOverviewRequest {
    string project_id = 1;
    AudioType audio_type = 2;
    repeated string source_ids = 3;
    string custom_instructions = 4;
    AudioLength length = 5;
    string language = 6;  // e.g. "en"
}

// Video overview request (uses same R7cb6c RPC as audio, but with mode=3 parameter)
message CreateVideoOverviewRequest {
    string project_id = 1;
    AudioType audio_type = 2;      // Content style (only BRIEF=2 observed so far)
    repeated string source_ids = 3;
    string custom_instructions = 4;
    VideoStyle video_style = 5;    // Visual presentation style
    string language = 6;           // e.g. "en"
}

message CreateUniversalArtifactRequest {
    RequestContext context = 1;
    string project_id = 2;
    UniversalArtifactOptions options = 3;
    // Semantics unconfirmed. Observed as [1] on a slide request.
    repeated int32 unknown_6 = 6;
}

message UniversalArtifactOptions {
    // Fields 1 and 2 are null in observed requests.
    int32 kind = 3;
    repeated UniversalArtifactSourceGroup source_groups = 4;
    // Fields 5 and 6 are null in observed requests.
    UniversalAudioOptions audio = 7;
    // Field 8 is null in observed requests.
    UniversalVideoOptions video = 9;
    // Fields 11 through 14 and 16 are null in observed requests.
    UniversalArtifactOptionsUnknown10 unknown_10 = 10;
    // Observed as custom mind-map configuration. Repetition semantics are
    // unconfirmed.
    repeated ArtifactMindMapConfig mind_map_configs = 15;
    repeated UniversalSlideOptions slides = 17;
}

// UniversalArtifactOptionsUnknown10 is the observed [null, [kind, null,
// optional_text]] trailer. Its semantics are unconfirmed.
message UniversalArtifactOptionsUnknown10 {
    UniversalArtifactOptionsUnknown10Details details = 2;
}

message UniversalArtifactOptionsUnknown10Details {
    int32 value = 1;
    string text = 3;
}

message UniversalArtifactSourceGroup {
    SourceIdList source = 1;
}

message UniversalAudioOptions {
    // Field 1 is null in observed requests.
    UniversalAudioDetails details = 2;
}

message UniversalAudioDetails {
    // Field 1 is null in observed requests.
    int32 style = 2;
    // Field 3 is null in observed requests.
    repeated SourceIdList sources = 4;
    string language = 5;
    // Field 6 is null in observed requests.
    int32 enabled = 7;
}

message UniversalVideoOptions {
    // Fields 1 and 2 are null in observed requests.
    UniversalVideoDetails details = 3;
}

message UniversalVideoDetails {
    repeated UniversalArtifactSources sources = 1;
    string language = 2;
    optional string prompt = 3;
    // Field 4 is null in observed requests.
    int32 style = 5;
    optional int32 unknown_6 = 6; // semantics unconfirmed
}

message UniversalArtifactSources {
    string source_id = 1;
}

message UniversalSlideOptions {
    // Semantics unconfirmed. Observed as a plan-mode instruction string.
    string unknown_1 = 1;
    string language = 2;
    int32 format = 3;
    int32 style = 4;
}

message GetAudioOverviewRequest {
    string project_id = 1;
    int32 request_type = 2;
}

message DeleteAudioOverviewRequest {
    string project_id = 1;
}

message DiscoverSourcesRequest {
    string project_id = 1;
    string query = 2;
}

message DiscoverSourcesResponse {
    repeated Source sources = 1;
}

message GenerateFreeFormStreamedHistoryEntry {
    // Wire shape: [content, null, role]
    optional string content = 1;
    int32 role = 3;  // 1 = user, 2 = assistant
}

message GenerateFreeFormStreamedOptions {
    // Observed default request options: [2, null, [1], [1]]
    int32 mode = 1;
    repeated int32 citation_modes = 3;
    repeated int32 follow_up_modes = 4;
}

message GenerateFreeFormStreamedRequest {
    // The gRPC-Web endpoint still expects a manually constructed JSON array,
    // but this message mirrors the observed request state on that wire:
    //   [
    //     [[[source_ids]]],
    //     prompt,
    //     history,
    //     [mode, null, citation_modes, follow_up_modes],
    //     conversation_id,
    //     draft_response_id,
    //     parent_response_id,
    //     notebook_id,
    //     sequence_number
    //   ]
    string project_id = 1;
    string prompt = 2;
    repeated string source_ids = 3;
    repeated GenerateFreeFormStreamedHistoryEntry history = 4;
    GenerateFreeFormStreamedOptions options = 5;
    string conversation_id = 6;
    string draft_response_id = 7;
    string parent_response_id = 8;
    string notebook_id = 9;
    int32 sequence_number = 10;
}

message ChatConversationMetadata {
    string conversation_id = 1;
    string message_id = 2;
    int64 sequence_number = 3;
}

message ChatCharacterRange {
    int32 start = 1;
    int32 end = 2;
}

message ChatCitationSegment {
    ChatCharacterRange range = 1;
    string text = 2;
    bool emphasized = 3;
}

message ChatCitationExcerpt {
    ChatCharacterRange range = 1;
    repeated ChatCitationSegment segments = 2;
}

message ChatCitation {
    double confidence = 1;
    repeated ChatCharacterRange ranges = 2;
    repeated ChatCitationExcerpt excerpts = 3;
}

message ChatSourceMapping {
    ChatCharacterRange range = 1;
    repeated int32 source_indices = 2;
}

message ChatFollowUp {
    string text = 1;
    int32 type = 2;
}

message GenerateFreeFormStreamedResponse {
    // chunk preserves the cumulative answer text used by existing callers.
    string chunk = 1;
    // is_final mirrors the completion flag at response position [4].
    bool is_final = 2;
    ChatConversationMetadata conversation = 3;
    repeated ChatCitation citations = 4;
    repeated ChatSourceMapping source_mappings = 5;
    repeated string follow_up_text = 6;
    repeated ChatFollowUp follow_ups = 7;
}

message GenerateFreeFormStreamedWireRequest {
    repeated ChatSourceSelection sources = 1;
    string prompt = 2;
    repeated GenerateFreeFormStreamedHistoryEntry history = 3;
    ChatStreamOptions options = 4;
    string conversation_id = 5;
    // Field 6 is null in observed requests.
    optional string unknown_7 = 7;
    string notebook_id = 8;
    optional int32 sequence_number = 9;
    ChatStreamUnknown13 unknown_13 = 13;
}

// ChatStreamUnknown13 is an opaque repeated row carried by some streamed chat
// requests. Field meanings are unconfirmed.
message ChatStreamUnknown13 {
    repeated ChatStreamUnknown13Entry entries = 1;
}

message ChatStreamUnknown13Entry {
    string id = 1;
    ChatStreamUnknown13Values values = 2;
}

message ChatStreamUnknown13Values {
    optional string value = 1;
    optional int32 first = 2;
    optional int32 second = 3;
}

message ChatSourceSelection {
    SourceIdList source = 1;
}

message ChatStreamOptions {
    int32 mode = 1;
    // Field 2 is null.
    Int32List citation_modes = 3;
    ChatFollowUpOptions follow_up = 4;
}

message ChatFollowUpOptions {
    int32 enabled = 1;
    // Fields 2 through 10 are null.
    repeated int32 modes = 11;
}

message GenerateFreeFormStreamedWireResponse {
    ChatAnswer answer = 1;
    repeated Grounding citations = 2;
    repeated ChatStreamSourceMapping source_mappings = 3;
    ChatFollowUpTextList follow_up_text = 4;
    optional bool is_final = 5 [(json_bool) = true];
    ChatFollowUpList follow_ups = 6;
    optional bool complete = 7 [(json_bool) = true];
    string token = 8;
}

message ChatAnswer {
    string chunk = 1;
    // Fields 2 and 4 are null.
    ChatConversationMetadata conversation = 3;
    RichDocument document = 5;
}

message ChatStreamSourceMapping {
    OffsetRange range = 1;
    repeated int32 source_indices = 2;
}

message ChatFollowUpTextList {
    repeated string text = 1;
}

message ChatFollowUpList {
    repeated ChatFollowUp follow_up = 1;
}

message GenerateReportSuggestionsRequest {
    RequestContext context = 1;
    string project_id = 2;
    repeated SourceIdList source_ids = 3;
}

message ReportSuggestion {
    string title = 1;
    string description = 2;
    // field 3 is null in observed responses
    repeated SourceIdList source_ids = 4;
    string prompt = 5;
    int32 count = 6;
}

message GenerateReportSuggestionsResponse {
    repeated ReportSuggestion suggestions = 1;
}


message GetProjectAnalyticsRequest {
    string project_id = 1;
    RequestContext context = 2;
    google.protobuf.Timestamp requested_at = 3;
    Int32List mode = 4;
}

message ProjectAnalytics {
    repeated ProjectAnalyticsSeries series = 1;
}

// ProjectAnalyticsSeries contains the time buckets for one metric.
message ProjectAnalyticsSeries {
    int32 metric_id = 1;
    ProjectAnalyticsBuckets buckets = 2;
}

// ProjectAnalyticsBuckets retains the observed one-field wrapper around the
// repeated metric buckets.
message ProjectAnalyticsBuckets {
    ProjectAnalyticsPointList points = 1;
}

// ProjectAnalyticsPointList retains the second observed wrapper around the
// repeated metric buckets.
message ProjectAnalyticsPointList {
    repeated ProjectAnalyticsPoint points = 1;
}

// ProjectAnalyticsPoint is one [timestamp, null, value] metric bucket.
message ProjectAnalyticsPoint {
    google.protobuf.Timestamp time = 1;
    int32 value = 3;
}

message ListFeaturedProjectsRequest {
    optional int32 context_version = 1;
    RequestSurface context_surface = 3;
    RequestClientCaps context_caps = 4;
}

message FeaturedProjectImage {
    string url = 1;
    // Original image filename.
    string filename = 2;
    int64 position = 3;   // confirmed 1-based image position
    int64 image_kind = 4; // inferred image-kind code; observed 2
    // Serving URL for the image (lh3.googleusercontent.com/notebooklm/…).
    string image_url = 5;
}

message FeaturedProjectPresentation {
    optional bool curated = 1 [(json_bool) = true];
    repeated FeaturedProjectImage images = 2;
    string provider = 3;
    string description = 4;
    // Meaning unconfirmed; varies among featured presentations.
    optional bool presentation_flag = 5 [(json_bool) = true];
}

message FeaturedProject {
    string title = 1;
    repeated Source sources = 2;
    string project_id = 3;
    string emoji = 4;
    ProjectMetadata metadata = 6;
    ChatbotConfig chatbot_config = 8;
    // Two sets of capability flags carried as JSON booleans.
    repeated bool flags = 9 [(json_bool) = true];
    repeated bool flags2 = 10 [(json_bool) = true];
    // Per-notebook limits/quotas (observed [null,500,600,500000,3]).
    FeaturedProjectLimits limits = 11;
    FeaturedProjectPresentation presentation = 15;
}

message FeaturedProjectLimits {
    // field 1 reserved/unknown (observed null)
    int64 notebook_limit = 2; // confirmed by the identical ProjectLimits slot
    int64 source_limit = 3;   // confirmed by the identical ProjectLimits slot
    int64 upload_limit = 4;   // inferred byte/size limit; observed 500000
    int64 tier_code = 5;      // inferred tier code; observed 3
}

message ListFeaturedProjectsResponse {
    repeated FeaturedProject projects = 1;
}

// Update existing request messages to match Gemini's findings
message AddSourceRequest {
    repeated SourceInput sources = 1;
    string project_id = 2;
    RequestContext context = 3;
}

// AddSourcesResponse is the izAoDd response envelope: [[source, ...]].
message AddSourcesResponse {
