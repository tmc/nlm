// StartFastResearch (Ljjv0c): kick off a fast-research session. Wire
// shape verified by api.startFastResearchArgs (client.go:4587), against
// notebook 00000000-0000-4000-8000-000000000006, query
// "har harl file formats" (NotebookLM web UI capture, 2026-04-17).
// No HAR copy in this repo's capture set.
//
// JS bundle binding: Ljjv0c → DiscoverSourcesManifold. The
// "research" feature is built on top of the DiscoverSources job
// system; api.Client uses the StartFastResearch alias.
//
// Wire request: [[query, 1], null, 1, project_id]
// Wire response: [conversation_id]
//
// Mode int at position [2] is 1 for fast, 5 for deep. The trailing 1
// at position [0][1] is opaque (same byte the deep variant carries).
message StartFastResearchRequest {
    string project_id = 1;
    string query = 2;
}

message StartFastResearchResponse {
