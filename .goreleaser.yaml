version: 2

snapshot:
  version_template: '0.0.0-{{ replace (replace (replace (replace .CommitDate "-" "") ":" "") "T" "") "Z" "" }}-{{ .ShortCommit }}'

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/nlm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

gomod:
  proxy: true

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # Archives only. SBOMs carry a fresh SPDX timestamp and document UUID per
  # run, so including them would make checksums.txt non-reproducible.
  ids:
    - archives

archives:
  - id: archives
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.spdx.json"
    args:
      - $artifact
      - --output
      - spdx-json@2.3=$document

brews:
  - name: nlm
    directory: Formula
    license: MIT
    skip_upload: auto
    homepage: https://github.com/tmc/nlm
    description: Command-line interface and MCP server for Google NotebookLM
    test: |
      system "#{bin}/nlm", "--version"
    repository:
      owner: tmc
      name: homebrew-tap
      branch: "{{.ProjectName}}-{{.Version}}"
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
    commit_author:
      name: github-actions
      email: 41898282+github-actions[bot]@users.noreply.github.com

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
