version: 2

snapshot:
  version_template: '0.0.0-{{ replace (replace (replace (replace .CommitDate "-" "") ":" "") "T" "") "Z" "" }}-{{ .ShortCommit }}'

before:
  hooks:
    # verify, not tidy: tidy may rewrite go.mod and go.sum mid-release, which
    # would mean the released binary is pinned by something other than what was
    # committed and reviewed. verify checks the module cache against go.sum.
    - go mod verify

builds:
  - main: ./cmd/nlm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

gomod:
  proxy: true

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # Archives and SBOMs. This previously covered archives only, because syft
  # stamped every SPDX document with a fresh timestamp and UUID and so made
  # checksums.txt differ between identical builds. cyclonedx-gomod is
  # deterministic, so the documents can be covered too.
  ids:
    - archives
    - sbom

archives:
  - id: archives
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

sboms:
  # cyclonedx-gomod rather than syft. Both read the same source -- the module
  # list the Go toolchain embeds in every binary -- but this one arrives through
  # the module proxy, hash-verified by sum.golang.org and compiled from source
  # by our own toolchain, instead of as an opaque vendor binary downloaded into
  # the job that holds the tap credential. It also emits per-component SHA-256
  # hashes, and -noserial -notimestamp make the document byte-reproducible;
  # syft ignores SOURCE_DATE_EPOCH and cannot be made deterministic.
  - id: sbom
    # Binaries, not archives: cyclonedx-gomod reads a binary's build info and
    # cannot look inside a tarball. The attestation still binds each document to
    # its archive, which is what users actually download.
    artifacts: binary
    cmd: cyclonedx-gomod
    args:
      - bin
      - -json
      - -noserial
      - -notimestamp
      - -version
      - "v{{ .Version }}"
      - -output
      - $document
      - $artifact
    documents:
      # Mirrors the archive name template above so each document pairs
      # unambiguously with the archive it describes.
      - '{{ .ProjectName }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}.cdx.json'

brews:
  - name: nlm
    directory: Formula
    license: MIT
    skip_upload: auto
    homepage: https://github.com/tmc/nlm
    description: Command-line interface and MCP server for Google NotebookLM
    test: |
      system "#{bin}/nlm", "--version"
    repository:
      owner: tmc
      name: homebrew-tap
      branch: "{{.ProjectName}}-{{.Version}}"
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
    commit_author:
      name: github-actions
      email: 41898282+github-actions[bot]@users.noreply.github.com

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
