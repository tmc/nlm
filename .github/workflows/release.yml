name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write            # create the GitHub release
  id-token: write            # OIDC identity for attestations
  attestations: write        # write attestations back to the repo
  artifact-metadata: write   # storage records for attested artifacts

# Every action is pinned to a commit SHA rather than a tag: a tag is mutable, so
# `@v4` means "whatever that ref points at on release day", and this job holds
# the credential that can write to the Homebrew tap. .github/dependabot.yml
# keeps the pins current -- without it, pinning trades silent updates for
# silently stale ones.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # tags, for the version and changelog

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # The SBOM generator. Installed through the module proxy so it is
      # hash-verified against sum.golang.org and compiled from source here --
      # a stronger pin than a git tag, and one fewer vendor binary downloaded
      # into a job that can write to the tap. Replaced syft, which shipped as an
      # opaque release asset and produced non-deterministic documents.
      - name: install cyclonedx-gomod
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Mint a short-lived installation token for the tap. The App is installed
      # on tmc/homebrew-tap alone, so this token cannot reach any other
      # repository; it expires within the hour and the action revokes it when
      # the job ends. The permission-* inputs narrow it below what the
      # installation grants, so widening the App later cannot silently widen
      # this job.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: tmc
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Exact, not a constraint: pinning the action while letting it fetch
          # any 2.17.x leaves the binary that writes our formula unpinned.
          version: "v2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default GITHUB_TOKEN cannot push to another repository, and a
          # pull request it opened would not trigger the tap's CI. An App
          # installation token does both.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}

      # Symbol-level reachability against the artifact that actually ships.
      # This is the Go-native check and is strictly more informative than
      # matching SBOM package versions against CVE lists, which cannot tell
      # whether vulnerable code is reachable. Blocking: nlm is clean today, so
      # keep it that way rather than letting findings accumulate.
      - name: govulncheck (binary mode)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          for bin in dist/*/nlm dist/*/nlm.exe; do
            [ -f "$bin" ] || continue
            echo "::group::govulncheck $bin"
            govulncheck -mode=binary "$bin"
            echo "::endgroup::"
          done

      # Build provenance over every archive and SBOM. checksums.txt covers both
      # now that the SBOMs are byte-reproducible.
      - name: attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ./dist/checksums.txt

      # One SBOM attestation per archive. actions/attest binds a single SBOM to
      # a single subject, and the gh CLI cannot create attestations, so these
      # are enumerated rather than looped. The document describes the binary
      # inside the archive; the subject is the archive, because that is what
      # users download and can verify.
      - name: attest SBOM (darwin/amd64)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ./dist/nlm_Darwin_x86_64.tar.gz
          sbom-path: ./dist/nlm_Darwin_x86_64.cdx.json

      - name: attest SBOM (darwin/arm64)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ./dist/nlm_Darwin_arm64.tar.gz
          sbom-path: ./dist/nlm_Darwin_arm64.cdx.json

      - name: attest SBOM (linux/amd64)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ./dist/nlm_Linux_x86_64.tar.gz
          sbom-path: ./dist/nlm_Linux_x86_64.cdx.json

      - name: attest SBOM (linux/arm64)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ./dist/nlm_Linux_arm64.tar.gz
          sbom-path: ./dist/nlm_Linux_arm64.cdx.json

      - name: attest SBOM (windows/amd64)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ./dist/nlm_Windows_x86_64.zip
          sbom-path: ./dist/nlm_Windows_x86_64.cdx.json
