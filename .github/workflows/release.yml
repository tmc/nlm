name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write            # create the GitHub release
  id-token: write            # OIDC identity for attestations
  attestations: write        # write attestations back to the repo
  artifact-metadata: write   # storage records for attested artifacts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tags, for the version and changelog

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # syft is not bundled with GoReleaser; without it the sboms stage
      # silently produces nothing.
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2.17"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default GITHUB_TOKEN cannot push to another repository, so the
          # Homebrew tap needs its own token.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Symbol-level reachability against the artifact that actually ships.
      # This is the Go-native check and is strictly more informative than
      # matching SBOM package versions against CVE lists, which cannot tell
      # whether vulnerable code is reachable.
      - name: govulncheck (binary mode)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          for bin in dist/*/nlm dist/*/nlm.exe; do
            [ -f "$bin" ] || continue
            echo "::group::govulncheck $bin"
            govulncheck -mode=binary "$bin"
            echo "::endgroup::"
          done

      # Build provenance over every archive. checksums.txt deliberately covers
      # archives only, so it is byte-reproducible; SBOMs are attested below.
      - name: attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

      # One SBOM attestation per archive. actions/attest binds a single SBOM to
      # a single subject, and the gh CLI cannot create attestations, so these
      # are enumerated rather than looped.
      - name: attest SBOM (darwin/amd64)
        uses: actions/attest@v4
        with:
          subject-path: ./dist/nlm_Darwin_x86_64.tar.gz
          sbom-path: ./dist/nlm_Darwin_x86_64.tar.gz.sbom.spdx.json

      - name: attest SBOM (darwin/arm64)
        uses: actions/attest@v4
        with:
          subject-path: ./dist/nlm_Darwin_arm64.tar.gz
          sbom-path: ./dist/nlm_Darwin_arm64.tar.gz.sbom.spdx.json

      - name: attest SBOM (linux/amd64)
        uses: actions/attest@v4
        with:
          subject-path: ./dist/nlm_Linux_x86_64.tar.gz
          sbom-path: ./dist/nlm_Linux_x86_64.tar.gz.sbom.spdx.json

      - name: attest SBOM (linux/arm64)
        uses: actions/attest@v4
        with:
          subject-path: ./dist/nlm_Linux_arm64.tar.gz
          sbom-path: ./dist/nlm_Linux_arm64.tar.gz.sbom.spdx.json

      - name: attest SBOM (windows/amd64)
        uses: actions/attest@v4
        with:
          subject-path: ./dist/nlm_Windows_x86_64.zip
          sbom-path: ./dist/nlm_Windows_x86_64.zip.sbom.spdx.json
