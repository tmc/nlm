name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub release
  id-token: write      # OIDC identity for the attestation
  attestations: write  # write the attestation back to the repo

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tags, for the version and changelog

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # syft is not bundled with GoReleaser; without it the sboms stage
      # silently produces nothing.
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2.17"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default GITHUB_TOKEN cannot push to another repository, so the
          # Homebrew tap needs its own token.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt
